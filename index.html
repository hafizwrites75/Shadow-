</html><!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Open City — Final Build</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}
#game{display:block;width:100%;height:100%;touch-action:none}
#hint{position:fixed;left:10px;top:10px;padding:8px 11px;border-radius:10px;background:#0009;color:#fff;font-size:13px;z-index:5}
#wanted{position:fixed;right:18px;top:14px;padding:8px 12px;border-radius:10px;background:#000b;color:#fff;font-weight:700;z-index:7}
#weapon{position:fixed;left:10px;bottom:150px;padding:7px 10px;border-radius:9px;background:#0009;color:#fff;font-size:13px;z-index:7}
#health{position:fixed;left:10px;bottom:112px;padding:7px 10px;border-radius:9px;background:#0009;color:#fff;font-size:13px;z-index:7}
#joy{position:fixed;left:22px;bottom:24px;width:112px;height:112px;border-radius:50%;background:#fff2;border:1px solid #fff5;z-index:5;touch-action:none}
#stick{position:absolute;left:31px;top:31px;width:50px;height:50px;border-radius:50%;background:#fff8}
#look{position:fixed;right:0;top:0;width:58%;height:72%;z-index:4;touch-action:none}
/* Action Buttons */
.btn{position:fixed;z-index:10;border-radius:50%;border:2px solid #fff;font-weight:bold;color:#fff;box-shadow:0 4px 10px rgba(0,0,0,0.7);touch-action:none}
#runBtn{left:25px;bottom:30px;width:75px;height:75px;background:#e84393;font-size:15px}
#carBtn{right:25px;bottom:25px;width:70px;height:70px;background:#0984e3;font-size:12px}
/* Vehicle Driving UI Controls */
.car-steer-group{position:fixed;left:20px;bottom:30px;z-index:10;display:none;gap:15px}
.car-accel-group{position:fixed;right:20px;bottom:30px;z-index:10;display:none;flex-direction:column;gap:15px}
.c-btn{width:65px;height:65px;border-radius:15px;border:2px solid #fff;background:rgba(20,20,20,0.85);color:#fff;font-size:24px;font-weight:bold;touch-action:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hint">GTA VICE CITY - ALL ONLINE ASSETS READY</div>
<div id="wanted">WANTED: ☆☆☆☆☆</div>
<div id="weapon">🔫 Pistol • Ammo: 12</div>
<div id="health">❤️ Health: 100 • Armor: 0</div>
<!-- Buttons -->
<button class="btn" id="runBtn">🏃 RUN</button>
<button class="btn" id="carBtn">🚗 ENTER</button>
<!-- Driving Controls -->
<div class="car-steer-group" id="steerGroup">
  <button class="c-btn" id="cLeft">⬅️</button>
  <button class="c-btn" id="cRight">➡️</button>
</div>
<div class="car-accel-group" id="accelGroup">
  <button class="c-btn" id="cUp">⬆️</button>
  <button class="c-btn" id="cDown">⬇️</button>
</div>
<div id="joy"><div id="stick"></div></div>
<div id="look"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
window.addEventListener('DOMContentLoaded', () => {
    const canvas=document.getElementById('game');
    const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.setSize(innerWidth,innerHeight);
    renderer.shadowMap.enabled=true;

    const scene=new THREE.Scene();
    scene.background=new THREE.Color(0x8bb7d9);
    scene.fog=new THREE.FogExp2(0x8bb7d9,0.0015);

    const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1000);

    scene.add(new THREE.HemisphereLight(0xbfe2ff,0x39412f,1.8));
    const sun=new THREE.DirectionalLight(0xffffff,2.2);
    sun.position.set(80,130,50); sun.castShadow=true; scene.add(sun);

    const colliders=[];

    // --- CITY ENVIRONMENT & ROAD NETWORK ---
    const ocean=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200),new THREE.MeshLambertMaterial({color:0x00cec9}));
    ocean.rotation.x=-Math.PI/2; ocean.position.y=-0.5;
    scene.add(ocean);

    const ground=new THREE.Mesh(
     new THREE.BoxGeometry(600,2,800),
     new THREE.MeshStandardMaterial({color:0x55efc4,roughness:1})
    );
    ground.position.set(0,0,0); scene.add(ground);

    const roadMat=new THREE.MeshStandardMaterial({color:0x2d3436});
    const mainRoad=new THREE.Mesh(new THREE.PlaneGeometry(35,780),roadMat);
    mainRoad.rotation.x=-Math.PI/2; mainRoad.position.set(-180,1.1,0);
    scene.add(mainRoad);

    // Palm Tree Generator (Vice City Ocean Drive Style)
    function createPalmTree(x,z){
        const treeGroup=new THREE.Group();
        const trunkGeo=new THREE.CylinderGeometry(0.3,0.5,8,8);
        const trunkMat=new THREE.MeshLambertMaterial({color:0x8e583c});
        const trunk=new THREE.Mesh(trunkGeo,trunkMat); trunk.position.y=4; treeGroup.add(trunk);
        const leafMat=new THREE.MeshLambertMaterial({color:0x10ac84});
        for(let i=0;i<5;i++){
            const leaf=new THREE.Mesh(new THREE.BoxGeometry(4,0.1,1.2),leafMat);
            leaf.position.set(0,8,0); leaf.rotation.y=(Math.PI/2.5)*i; leaf.rotation.z=0.3; treeGroup.add(leaf);
        }
        treeGroup.position.set(x,1,z); scene.add(treeGroup); colliders.push(new THREE.Box3().setFromObject(trunk));
    }
    for(let z=-350;z<=350;z+=50){ createPalmTree(-125,z); }

    // GTA VICE CITY SAFEHOUSE (Ocean View Hotel Style)
    const houseGroup=new THREE.Group(); houseGroup.position.set(-130,1,-100);
    const hotelBase=new THREE.Mesh(new THREE.BoxGeometry(35,25,25),new THREE.MeshLambertMaterial({color:0xfab1a0}));
    hotelBase.position.y=12.5; houseGroup.add(hotelBase);
    const hotelSign=new THREE.Mesh(new THREE.BoxGeometry(25,4,3),new THREE.MeshLambertMaterial({color:0xe84393}));
    hotelSign.position.set(0,26,11); houseGroup.add(hotelSign);
    for(let i=0;i<4;i++){
        const step=new THREE.Mesh(new THREE.BoxGeometry(12,0.5,1.8),new THREE.MeshLambertMaterial({color:0xdfe6e9}));
        step.position.set(0,i*0.5+0.25,12.5+(i*1.5)); houseGroup.add(step);
    }
    scene.add(houseGroup); colliders.push(new THREE.Box3().setFromObject(hotelBase));

    // BUILDINGS (Ocean Drive Setup)
    function addBuilding(x,z,w,h,d,color){
        const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:color}));
        mesh.position.set(x,h/2+1,z); scene.add(mesh); colliders.push(new THREE.Box3().setFromObject(mesh));
    }
    const vcColors=[0xfd79a8,0x81ecec,0xffebe9,0xfffe6a,0xa29bfe];
    for(let z=-320;z<=320;z+=70){
        if(Math.abs(z-(-100))<40) continue;
        addBuilding(-240,z,40,30+Math.random()*25,45,vcColors[Math.floor(Math.random()*vcColors.length)]);
        addBuilding(100,z,50,35+Math.random()*25,45,vcColors[Math.floor(Math.random()*vcColors.length)]);
    }

    // --- PLAYER CHARACTER (Tommy Style) ---
    const player=new THREE.Group();
    const pBody=new THREE.Mesh(new THREE.BoxGeometry(1.2,2.0,0.8),new THREE.MeshLambertMaterial({color:0x00cec9}));
    pBody.position.y=1.0; player.add(pBody);
    const pHead=new THREE.Mesh(new THREE.SphereGeometry(0.4,12,12),new THREE.MeshLambertMaterial({color:0xffeaa7}));
    pHead.position.y=2.2; player.add(pHead);
    player.position.set(-130,1.0,-82); scene.add(player);

    // --- CAR SETUP ---
    const car=new THREE.Group();
    const cBase=new THREE.Mesh(new THREE.BoxGeometry(2.8,1.1,5.0),new THREE.MeshLambertMaterial({color:0xd63031}));
    cBase.position.y=0.55; car.add(cBase);
    const cCabin=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.7,2.5),new THREE.MeshLambertMaterial({color:0x2d3436}));
    cCabin.position.set(0,1.3,-0.2); car.add(cCabin);
    car.position.set(-165,1.0,-82); scene.add(car);

    // --- BIKE CREATION ---
    const bike=new THREE.Group();
    const bBody=new THREE.Mesh(new THREE.BoxGeometry(1.0,0.8,2.4),new THREE.MeshLambertMaterial({color:0x222222}));
    bBody.position.y=0.5; bike.add(bBody);
    for(const dz of [-0.9,0.9]){
        const w=new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.34,0.18,12),new THREE.MeshStandardMaterial({color:0x111111}));
        w.rotation.z=Math.PI/2; w.position.set(0,0.45,dz); bike.add(w);
    }
    bike.position.set(-150,0, -70); scene.add(bike);

    // --- BUS CREATION ---
    const bus=new THREE.Group();
    const busBody=new THREE.Mesh(new THREE.BoxGeometry(3.5,3.0,12.0),new THREE.MeshLambertMaterial({color:0x0984e3}));
    busBody.position.y=1.5; bus.add(busBody);
    bus.position.set(-200,0, -100); scene.add(bus);

    let vehicleSpeed=0; const maxSpeed=1.1, accel=0.02, friction=0.95;

    // --- TRAFFIC CARS ---
    const trafficCars=[];
    function createTrafficCar(x,z,dir){
        const tCar=new THREE.Group();
        const body=new THREE.Mesh(new THREE.BoxGeometry(2.8,1.1,5.0),new THREE.MeshLambertMaterial({color:0xfdcb6e}));
        body.position.y=0.55; tCar.add(body);
        tCar.position.set(x,1.0,z); scene.add(tCar);
        return {mesh:tCar,speed:0.35,dir:dir,box:new THREE.Box3()};
    }
    for(let i=0;i<6;i++){ trafficCars.push(createTrafficCar(-180+(i%2==0?6:-6),-300+i*100,i%2==0?1:-1)); }

    // --- PEDESTRIAN A.I (عام لوگ) ---
    const peds=[];
    function spawnPedestrian(x,z){
        const ped=new THREE.Mesh(new THREE.BoxGeometry(1.0,1.9,0.6),new THREE.MeshLambertMaterial({color:0x6c5ce7}));
        ped.position.set(x,1.5,z); scene.add(ped);
        peds.push({mesh:ped,dir:Math.random()*Math.PI*2,speed:0.08});
    }
    for(let i=0;i<15;i++) spawnPedestrian(-100+Math.random()*80,-200+Math.random()*400);

    // CONTROLS & CAMERA
    let inCar=false, isRunning=false, currentVehicle=null, vehicleType='';
    let cameraYaw=0, cameraPitch=0.25;
    const vInput={up:false,down:false,left:false,right:false};

    // Multi-touch Camera Setup
    let cameraTouchId=null, lastX=0, lastY=0;
    const runBtn=document.getElementById('runBtn');
    runBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); isRunning=true; }, {passive:false});
    runBtn.addEventListener('touchend', (e)=>{ e.preventDefault(); isRunning=false; }, {passive:false});

    window.addEventListener('touchstart', (e)=>{
        for(let i=0;i<e.changedTouches.length;i++){
            const touch=e.changedTouches[i];
            if(touch.target!==runBtn && !touch.target.classList.contains('c-btn') && touch.target!==carBtn){
                cameraTouchId=touch.identifier; lastX=touch.clientX; lastY=touch.clientY; break;
            }
        }
    });
    window.addEventListener('touchmove', (e)=>{
        for(let i=0;i<e.changedTouches.length;i++){
            const touch=e.changedTouches[i];
            if(touch.identifier===cameraTouchId){
                const dx=touch.clientX-lastX; const dy=touch.clientY-lastY;
                cameraYaw-=dx*0.008; cameraPitch=Math.max(-0.2,Math.min(0.9,cameraPitch+dy*0.008));
                lastX=touch.clientX; lastY=touch.clientY;
            }
        }
    });
    window.addEventListener('touchend', (e)=>{
        for(let i=0;i<e.changedTouches.length;i++){ if(e.changedTouches[i].identifier===cameraTouchId) cameraTouchId=null; }
    });

    // Vehicle Driving Controls
    const setupBtn=(id,key)=>{
        const btn=document.getElementById(id);
        btn.addEventListener('touchstart', (e)=>{ e.preventDefault(); vInput[key]=true; }, {passive:false});
        btn.addEventListener('touchend', (e)=>{ e.preventDefault(); vInput[key]=false; }, {passive:false});
    };
    setupBtn('cUp','up'); setupBtn('cDown','down'); setupBtn('cLeft','left'); setupBtn('cRight','right');

    const carBtn=document.getElementById('carBtn'), steerGroup=document.getElementById('steerGroup'), accelGroup=document.getElementById('accelGroup');
    carBtn.addEventListener('click', ()=>{
        if(!inCar){
            const vehicles=[{mesh:car,type:'car'},{mesh:bike,type:'bike'},{mesh:bus,type:'bus'}];
            for(let v of vehicles){
                if(player.position.distanceTo(v.mesh.position)<8){
                    inCar=true; currentVehicle=v.mesh; vehicleType=v.type; player.visible=false;
                    carBtn.textContent='🚶 EXIT'; runBtn.style.display='none'; steerGroup.style.display='flex'; accelGroup.style.display='flex';
                    cameraYaw=v.mesh.rotation.y; break;
                }
            }
        } else {
            inCar=false; player.position.copy(currentVehicle.position); player.position.x+=4; player.visible=true;
            carBtn.textContent='🚗 ENTER'; runBtn.style.display='flex'; steerGroup.style.display='none'; accelGroup.style.display='none';
            currentVehicle=null; vehicleType='';
        }
    });

    // Collision Check
    function checkCollision(nextPos, radius){
        const pBox=new THREE.Box3(new THREE.Vector3(nextPos.x-radius,0,nextPos.z-radius),new THREE.Vector3(nextPos.x+radius,4,nextPos.z+radius));
        for(let box of colliders){ if(pBox.intersectsBox(box)) return true; }
        return false;
    }

    // MAIN GAME LOOP
    function animate(){
        requestAnimationFrame(animate);
        trafficCars.forEach(tc=>{ tc.mesh.position.z+=tc.speed*tc.dir; if(tc.mesh.position.z>350) tc.mesh.position.z=-350; if(tc.mesh.position.z<-350) tc.mesh.position.z=350; tc.box.setFromObject(tc.mesh); });
        peds.forEach(p=>{ p.mesh.position.x-=Math.sin(p.dir)*p.speed; p.mesh.position.z-=Math.cos(p.dir)*p.speed; if(Math.random()<0.01) p.dir+=(Math.random()-0.5); });

        if(!inCar){
            if(isRunning){
                const speed=0.4; const nextPos=player.position.clone(); nextPos.x-=Math.sin(cameraYaw)*speed; nextPos.z-=Math.cos(cameraYaw)*speed;
                if(!checkCollision(nextPos,1.0)) player.position.copy(nextPos);
                player.rotation.y=cameraYaw+Math.PI;
            }
        } else {
            const maxS=vehicleType==='bike'?1.6:(vehicleType==='bus'?0.9:1.1); const ac=vehicleType==='bike'?0.04:0.02;
            if(vInput.up) vehicleSpeed=Math.min(maxS,vehicleSpeed+ac); else if(vInput.down) vehicleSpeed=Math.max(-maxS*0.4,vehicleSpeed-ac); else vehicleSpeed*=friction;
            if(Math.abs(vehicleSpeed)>0.02){ const dir=vehicleSpeed>0?1:-1; const turnSpeed=(vehicleType==='bike'?0.05:0.035)*dir; if(vInput.left){ currentVehicle.rotation.y+=turnSpeed; cameraYaw+=turnSpeed; } if(vInput.right){ currentVehicle.rotation.y-=turnSpeed; cameraYaw-=turnSpeed; } }
            const nextVehiclePos=currentVehicle.position.clone(); nextVehiclePos.x-=Math.sin(currentVehicle.rotation.y)*vehicleSpeed; nextVehiclePos.z-=Math.cos(currentVehicle.rotation.y)*vehicleSpeed;
            if(!checkCollision(nextVehiclePos,1.8)) currentVehicle.position.copy(nextVehiclePos); else vehicleSpeed=-vehicleSpeed*0.3;
        }

        const target=inCar?currentVehicle:player; const dist=inCar?(vehicleType==='bus'?28:20):14;
        camera.position.x=target.position.x+Math.sin(cameraYaw)*Math.cos(cameraPitch)*dist; camera.position.y=target.position.y+Math.sin(cameraPitch)*dist+2.5; camera.position.z=target.position.z+Math.cos(cameraYaw)*Math.cos(cameraPitch)*dist; camera.lookAt(target.position.x,target.position.y+1.2,target.position.z);
        renderer.render(scene,camera);
    }
    animate();
    window.addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
});
</script>
</body>
</html>
