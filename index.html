<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butterfly Neon Animation</title>
    <style>
        /* پورا بیک گراؤنڈ بلیک رہے گا */
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        canvas {
            background-color: #000;
            display: block;
        }
    </style>
</head>
<body>

    <!-- کینوس جہاں اینیمیشن ڈرا ہوگی -->
    <canvas id="butterflyCanvas"></canvas>

    <script>
        const canvas = document.getElementById('butterflyCanvas');
        const ctx = canvas.getContext('2d');

        // کینوس کا سائز سیٹ کریں
        canvas.width = 600;
        canvas.height = 800;

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2 - 30;

        // ویڈیو کے مطابق رنگوں کی لسٹ (RGB Format)
        const colors = [
            { r: 0, g: 210, b: 255 },   // فیروزی / Cyan
            { r: 255, g: 20, b: 60 },   // سرخ / Red
            { r: 0, g: 255, b: 120 },   // ہلکا ہرا / Neon Green
            { r: 230, g: 0, b: 255 },   // جامنی / Purple
            { r: 50, g: 50, b: 255 }    # نیلا / Blue
        ];

        let colorIndex = 0;
        let colorTimer = 0;
        const numPoints = 42; // نقطوں اور لائنوں کی تعداد
        let t = 0;

        function animate() {
            requestAnimationFrame(animate);

            t += 0.04;
            colorTimer += 1;

            // ہر 2.5 سیکنڈ بعد رنگ تبدیل ہوگا
            if (colorTimer > 150) {
                colorIndex = (colorIndex + 1) % colors.length;
                colorTimer = 0;
            }

            const currentColor = colors[colorIndex];
            const colorStr = `rgb(${currentColor.r}, ${currentColor.g}, ${currentColor.b})`;

            // اسکرین کو ہر فریم میں صاف (Clear) کریں
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const points = [];

            // تتلی کی شکل کا ریاضیاتی فارمولا (Butterfly Curve Formula)
            for (let i = 0; i < numPoints; i++) {
                const angle = (Math.PI * 2 / numPoints) * i;

                // پروں کے پھیلنے اور سکڑنے کی حرکت (Pulse effect)
                const pulse = Math.sin(t * 2) * 0.12 + 1.0;
                const r = (Math.exp(Math.cos(angle)) - 2 * Math.cos(4 * angle) + Math.pow(Math.sin(angle / 12), 5)) * 65 * pulse;

                const x = centerX + r * Math.sin(angle);
                const y = centerY - r * Math.cos(angle);

                points.push({ x, y });
            }

            // مرکز کے ہلنے کی حرکت
            const centerPos = {
                x: centerX,
                y: centerY + Math.sin(t * 3) * 8
            };

            // 1. مرکز سے ہر نقطے تک لائنیں بنائیں (Glow Lines)
            ctx.shadowBlur = 10;
            ctx.shadowColor = colorStr;
            ctx.strokeStyle = colorStr;
            ctx.lineWidth = 2;

            for (let pt of points) {
                ctx.beginPath();
                ctx.moveTo(centerPos.x, centerPos.y);
                ctx.lineTo(pt.x, pt.y);
                ctx.stroke();
            }

            // 2. باہر کے چمکدار نقطے (Glow Dots) بنائیں
            for (let pt of points) {
                // چمکدار نینون اثر (Neon Glow)
                ctx.shadowBlur = 15;
                ctx.shadowColor = colorStr;
                ctx.fillStyle = colorStr;

                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 7, 0, Math.PI * 2);
                ctx.fill();
            }

            // 3. مرکز کا سفید چمکدار نقطہ
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ffffff';
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(centerPos.x, centerPos.y, 5, 0, Math.PI * 2);
            ctx.fill();
        }

        // اینیمیشن شروع کریں
        animate();
    </script>
</body>
</html>
