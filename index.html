<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Open City Prototype — Mobile Fixed</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
#game{display:block;width:100vw;height:100vh;touch-action:none}
#hint{position:fixed;left:10px;top:10px;padding:8px 11px;border-radius:10px;background:#0009;color:#fff;font-size:13px;z-index:5}
#wanted{position:fixed;right:18px;top:14px;padding:8px 12px;border-radius:10px;background:#000b;color:#fff;font-weight:700;z-index:7}
#weapon{position:fixed;left:10px;bottom:150px;padding:7px 10px;border-radius:9px;background:#0009;color:#fff;font-size:13px;z-index:7}
#health{position:fixed;left:10px;bottom:112px;padding:7px 10px;border-radius:9px;background:#0009;color:#fff;font-size:13px;z-index:7}
#joy{position:fixed;left:22px;bottom:24px;width:112px;height:112px;border-radius:50%;background:#fff2;border:1px solid #fff5;z-index:5}
#stick{position:absolute;left:31px;top:31px;width:50px;height:50px;border-radius:50%;background:#fff8}
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="hint">STEP 25 • Mobile Optimized</div>
<div id="wanted">WANTED: ☆☆☆☆☆</div>
<div id="weapon">🔫 Pistol • Ammo: 12</div>
<div id="health">❤️ Health: 100 • Armor: 0</div>
<div id="joy"><div id="stick"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
window.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('game');
    
    // Fallback Canvas WebGL Renderer for Mobile
    let renderer;
    try {
        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false, powerPreference: "high-performance" });
    } catch (e) {
        alert("WebGL Not Supported on this Browser");
        return;
    }

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8bb7d9);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 8, 16);

    // Basic Lighting (No heavy shadows for Mobile performance)
    const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
    scene.add(light);

    // Ground
    const groundMat = new THREE.MeshBasicMaterial({ color: 0x6e8b62 });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), groundMat);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // City Buildings
    const bMat = new THREE.MeshBasicMaterial({ color: 0x7a7a7a });
    for(let x = -80; x <= 80; x += 40) {
        for(let z = -80; z <= 80; z += 40) {
            if(Math.abs(x) < 20 && Math.abs(z) < 20) continue;
            const b = new THREE.Mesh(new THREE.BoxGeometry(18, 25, 18), bMat);
            b.position.set(x, 12.5, z);
            scene.add(b);
        }
    }

    // Player Object
    const pMat = new THREE.MeshBasicMaterial({ color: 0x315b87 });
    const player = new THREE.Mesh(new THREE.BoxGeometry(1.5, 3, 1.5), pMat);
    player.position.set(0, 1.5, 0);
    scene.add(player);

    camera.lookAt(player.position);

    // Resize Handler
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Render Loop
    function animate() {
        requestAnimationFrame(animate);
        player.rotation.y += 0.01; // Simple Rotation Test
        renderer.render(scene, camera);
    }

    animate();
});
</script>
</body>
</html>
