<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Open City — Advanced Car & Foot Controls</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif;user-select:none}
#game{display:block;width:100vw;height:100vh;touch-action:none}
#hud{position:fixed;top:10px;left:10px;z-index:10;color:#fff;font-size:13px;display:flex;flex-direction:column;gap:5px}
.hud-box{background:rgba(0,0,0,0.7);padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.2)}
#wanted{position:fixed;right:15px;top:10px;z-index:10;background:rgba(0,0,0,0.8);color:#ffcc00;padding:8px 12px;border-radius:8px;font-weight:bold}
#money{position:fixed;right:15px;top:50px;z-index:10;color:#00ff66;font-size:18px;font-weight:bold;text-shadow:1px 1px 2px #000}

/* Buttons Styling */
.btn{position:fixed;z-index:10;border-radius:50%;border:none;font-weight:bold;color:#fff;box-shadow:0 4px 6px rgba(0,0,0,0.4);touch-action:none}
#runBtn{left:25px;bottom:30px;width:80px;height:80px;background:#27ae60;font-size:16px}
#fireBtn{right:25px;bottom:120px;width:70px;height:70px;background:#e74c3c;font-size:14px}
#carBtn{right:25px;bottom:30px;width:70px;height:70px;background:#3498db;font-size:12px}

/* Car Controls Overlay (4 Buttons) */
#carControls{position:fixed;left:20px;bottom:20px;z-index:10;display:none;width:160px;height:160px}
.c-btn{position:absolute;width:50px;height:50px;border-radius:10px;border:none;background:rgba(255,255,255,0.8);color:#000;font-size:20px;font-weight:bold;box-shadow:0 3px 5px rgba(0,0,0,0.5);touch-action:none}
#cUp{top:0;left:55px}
#cDown{bottom:0;left:55px}
#cLeft{top:55px;left:0}
#cRight{top:55px;right:0}

#touchLook{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:5}
#saveMenu{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:10px}
#saveMenu button{background:#222;color:#fff;border:1px solid #555;padding:6px 12px;border-radius:6px;font-weight:bold}
</style>
</head>
<body>

<canvas id="game"></canvas>

<!-- Touch Area for Camera Look & Swipe Direction -->
<div id="touchLook"></div>

<div id="saveMenu">
  <button onclick="saveGame()">💾 Save</button>
  <button onclick="loadGame()">📂 Load</button>
</div>

<div id="hud">
  <div class="hud-box" id="weapon">🔫 Pistol • Ammo: 30</div>
  <div class="hud-box" id="health">❤️ Health: 100 • 🛡️ Armor: 50</div>
  <div class="hud-box" id="mission">🎯 Open City Loaded</div>
</div>

<div id="wanted">WANTED: ☆☆☆☆☆</div>
<div id="money">$00001500</div>

<!-- On-Foot Controls -->
<button class="btn" id="runBtn">🏃 RUN</button>
<button class="btn" id="fireBtn">FIRE</button>
<button class="btn" id="carBtn">🚗 Enter</button>

<!-- Car Movement Controls (4 Buttons) -->
<div id="carControls">
  <button class="c-btn" id="cUp">⬆️</button>
  <button class="c-btn" id="cDown">⬇️</button>
  <button class="c-btn" id="cLeft">⬅️</button>
  <button class="c-btn" id="cRight">➡️</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
window.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('game');
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);

    const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
    scene.add(light);
    const sun = new THREE.DirectionalLight(0xffffff, 1.3);
    sun.position.set(100, 150, 50);
    scene.add(sun);

    // City Ground & Roads
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(800, 800), new THREE.MeshLambertMaterial({ color: 0x477836 }));
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    const roadMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

    for(let i = -240; i <= 240; i += 80) {
        const r1 = new THREE.Mesh(new THREE.BoxGeometry(800, 0.1, 20), roadMat);
        r1.position.set(0, 0.05, i); scene.add(r1);

        const r2 = new THREE.Mesh(new THREE.BoxGeometry(20, 0.1, 800), roadMat);
        r2.position.set(i, 0.05, 0); scene.add(r2);

        for(let j = -380; j <= 380; j += 20) {
            const l1 = new THREE.Mesh(new THREE.BoxGeometry(8, 0.12, 0.8), lineMat);
            l1.position.set(j, 0.06, i); scene.add(l1);
            const l2 = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.12, 8), lineMat);
            l2.position.set(i, 0.06, j); scene.add(l2);
        }
    }

    // City Buildings
    const buildingColors = [0xd5dbdb, 0x34495e, 0x95a5a6, 0xe67e22, 0x27ae60, 0x2980b9];
    for(let bx = -200; bx <= 200; bx += 80) {
        for(let bz = -200; bz <= 200; bz += 80) {
            if(Math.abs(bx) < 40 && Math.abs(bz) < 40) continue;
            const h = 20 + Math.floor(Math.random() * 35);
            const b = new THREE.Mesh(new THREE.BoxGeometry(50, h, 50), new THREE.MeshLambertMaterial({ color: buildingColors[Math.floor(Math.random() * buildingColors.length)] }));
            b.position.set(bx, h / 2, bz); scene.add(b);
        }
    }

    // Player Object
    const player = new THREE.Group();
    const pBody = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.0, 0.8), new THREE.MeshLambertMaterial({ color: 0x2980b9 }));
    pBody.position.y = 1.0; player.add(pBody);
    const pHead = new THREE.Mesh(new THREE.SphereGeometry(0.4, 12, 12), new THREE.MeshLambertMaterial({ color: 0xf1c40f }));
    pHead.position.y = 2.2; player.add(pHead);
    player.position.set(0, 0, 10);
    scene.add(player);

    // Car Object
    const car = new THREE.Group();
    const cBase = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.9, 4.8), new THREE.MeshLambertMaterial({ color: 0xc0392b }));
    cBase.position.y = 0.45; car.add(cBase);
    const cTop = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.8, 2.4), new THREE.MeshLambertMaterial({ color: 0x111111 }));
    cTop.position.set(0, 1.25, -0.2); car.add(cTop);
    car.position.set(10, 0.1, 20);
    scene.add(car);

    let inCar = false;
    let isRunning = false;
    let ammo = 30;
    let wantedStars = 0;
    let cameraAngle = 0;

    // Car Direction Controls State
    const carInput = { up: false, down: false, left: false, right: false };

    // Player Run Button Controls
    const runBtn = document.getElementById('runBtn');
    runBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isRunning = true; });
    runBtn.addEventListener('touchend', (e) => { e.preventDefault(); isRunning = false; });

    // Finger Touch Swipe for Camera & Direction Turn
    let lastTouchX = 0;
    const touchLook = document.getElementById('touchLook');
    touchLook.addEventListener('touchstart', (e) => { lastTouchX = e.touches[0].clientX; });
    touchLook.addEventListener('touchmove', (e) => {
        const deltaX = e.touches[0].clientX - lastTouchX;
        cameraAngle -= deltaX * 0.012;
        lastTouchX = e.touches[0].clientX;
    });

    // Car 4 Buttons Event Listeners
    const setupCarBtn = (id, key) => {
        const btn = document.getElementById(id);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); carInput[key] = true; });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); carInput[key] = false; });
    };
    setupCarBtn('cUp', 'up');
    setupCarBtn('cDown', 'down');
    setupCarBtn('cLeft', 'left');
    setupCarBtn('cRight', 'right');

    // Fire Button
    document.getElementById('fireBtn').addEventListener('click', () => {
        if (ammo > 0) {
            ammo--;
            document.getElementById('weapon').textContent = `🔫 Pistol • Ammo: ${ammo}`;
            const bullet = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), new THREE.MeshBasicMaterial({ color: 0xfff000 }));
            bullet.position.copy(player.position);
            bullet.position.y += 1.5;
            scene.add(bullet);
            setTimeout(() => scene.remove(bullet), 300);

            if (wantedStars < 5) {
                wantedStars++;
                document.getElementById('wanted').textContent = `WANTED: ${'★'.repeat(wantedStars)}${'☆'.repeat(5 - wantedStars)}`;
            }
        }
    });

    // Enter / Exit Vehicle
    const carBtn = document.getElementById('carBtn');
    const carControlsUI = document.getElementById('carControls');
    carBtn.addEventListener('click', () => {
        if (!inCar && player.position.distanceTo(car.position) < 6) {
            inCar = true;
            player.visible = false;
            carBtn.textContent = '🚶 Exit';
            runBtn.style.display = 'none';
            carControlsUI.style.display = 'block';
        } else if (inCar) {
            inCar = false;
            player.position.copy(car.position);
            player.position.x += 3.5;
            player.visible = true;
            carBtn.textContent = '🚗 Enter';
            runBtn.style.display = 'block';
            carControlsUI.style.display = 'none';
        }
    });

    // Save & Load Functions
    window.saveGame = function() {
        localStorage.setItem('viceSave', JSON.stringify({ x: player.position.x, z: player.position.z, ammo: ammo, stars: wantedStars }));
        alert('Game Saved!');
    };
    window.loadGame = function() {
        const data = JSON.parse(localStorage.getItem('viceSave'));
        if (data) {
            player.position.set(data.x, 0, data.z);
            ammo = data.ammo; wantedStars = data.stars;
            document.getElementById('weapon').textContent = `🔫 Pistol • Ammo: ${ammo}`;
            document.getElementById('wanted').textContent = `WANTED: ${'★'.repeat(wantedStars)}${'☆'.repeat(5 - wantedStars)}`;
            alert('Game Loaded!');
        }
    };

    // Render Loop
    function animate() {
        requestAnimationFrame(animate);

        if (!inCar) {
            // Player Movement (On-Foot)
            if (isRunning) {
                const speed = 0.35;
                const moveX = Math.sin(cameraAngle);
                const moveZ = Math.cos(cameraAngle);

                player.position.x -= moveX * speed;
                player.position.z -= moveZ * speed;
                player.rotation.y = cameraAngle + Math.PI;
            }
        } else {
            // Car Movement (4 Buttons)
            const carSpeed = 0.50;
            if (carInput.left) car.rotation.y += 0.04;
            if (carInput.right) car.rotation.y -= 0.04;

            if (carInput.up) {
                car.position.x -= Math.sin(car.rotation.y) * carSpeed;
                car.position.z -= Math.cos(car.rotation.y) * carSpeed;
            }
            if (carInput.down) {
                car.position.x += Math.sin(car.rotation.y) * (carSpeed * 0.5);
                car.position.z += Math.cos(car.rotation.y) * (carSpeed * 0.5);
            }
        }

        // Camera Follow Logic
        const activeObj = inCar ? car : player;
        const camDistance = inCar ? 22 : 18;
        camera.position.x = activeObj.position.x + Math.sin(cameraAngle) * camDistance;
        camera.position.y = activeObj.position.y + 10;
        camera.position.z = activeObj.position.z + Math.cos(cameraAngle) * camDistance;
        camera.lookAt(activeObj.position);

        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
});
</script>
</body>
</html>
